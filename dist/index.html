<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/Sivasuthakaran-Sanjeev-Portfolio/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sivasuthakaran Sanjeev</title>
    <!-- Google Fonts: Anton (for oversized hero headline) & Syne & Urbanist -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Anton&family=Syne:wght@700;800&family=Urbanist:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Prevent theme flash: set initial theme & bg before React mounts -->
    <script>
      (function() {
        try {
          var stored = localStorage.getItem('theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = stored ? stored === 'dark' : prefersDark;
          var root = document.documentElement;
          if (isDark) {
            root.classList.add('dark');
            root.style.backgroundColor = '#0a0a0a'; /* gray-950 */
            root.style.setProperty('color-scheme', 'dark');
          } else {
            root.classList.remove('dark');
            root.style.backgroundColor = '#f9fafb'; /* gray-50 */
            root.style.setProperty('color-scheme', 'light');
          }
        } catch (e) {
          // no-op
        }
      })();
    </script>
    <script type="module" crossorigin src="/Sivasuthakaran-Sanjeev-Portfolio/assets/index-DsAo4zsW.js"></script>
    <link rel="stylesheet" crossorigin href="/Sivasuthakaran-Sanjeev-Portfolio/assets/index-EnI4_t1G.css">
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
